name: Build KodoWord IPA

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec KodoWord/project.yml

      - name: Build unsigned iPad app
        run: |
          xcodebuild \
            -project KodoWord/KodoWord.xcodeproj \
            -scheme KodoWord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KodoWord.app Payload/
          zip -r KodoWord-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KodoWord-unsigned-IPA
          path: KodoWord-unsigned.ipa
